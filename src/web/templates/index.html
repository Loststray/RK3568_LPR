<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车牌检测工作台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">RK3568 LPR</p>
                <h1>车牌检测工作台</h1>
                <p class="hero-text">
                    上传单张图片或本地视频，网页会调用 `src/test.py` 的检测逻辑，
                    在页面中返回带标注的结果媒体和识别到的车牌信息。
                </p>
            </div>
            <div class="hero-metric">
                <span class="metric-label">流程</span>
                <strong>上传 → 预览 → 检测 → 回显</strong>
                <span class="metric-note">支持图片和视频两种模式</span>
            </div>
        </header>

        <main class="workspace">
            <section class="control-panel card">
                <div class="button-row">
                    <button id="upload-image-btn" class="action-btn action-btn-image" type="button">上传图像</button>
                    <button id="upload-video-btn" class="action-btn action-btn-video" type="button">上传视频</button>
                    <button id="detect-btn" class="action-btn action-btn-detect" type="button" disabled>检测车牌</button>
                </div>

                <div class="setting-row">
                    <label for="conf-thres">检测阈值</label>
                    <div class="range-wrap">
                        <input id="conf-thres" type="range" min="0.10" max="0.95" step="0.05" value="0.50">
                        <span id="conf-thres-value">0.50</span>
                    </div>
                </div>

                <p id="status-text" class="status-text status-idle">请选择一张图片或一个视频文件</p>

                <input id="image-input" type="file" accept="image/*" hidden>
                <input id="video-input" type="file" accept="video/*" hidden>
            </section>

            <section class="preview-grid">
                <article class="card media-card">
                    <div class="card-head">
                        <h2>原始媒体</h2>
                        <span id="source-badge" class="badge">未选择</span>
                    </div>
                    <div id="source-preview" class="media-stage empty-stage">
                        <p>上传后会在这里预览原始图片或视频</p>
                    </div>
                </article>

                <article class="card media-card">
                    <div class="card-head">
                        <h2>检测结果</h2>
                        <span id="result-badge" class="badge">等待检测</span>
                    </div>
                    <div id="result-preview" class="media-stage empty-stage">
                        <p>点击“检测车牌”后展示标注结果</p>
                    </div>
                </article>
            </section>

            <section class="insight-grid">
                <article class="card insight-card">
                    <div class="card-head">
                        <h2>识别摘要</h2>
                        <span class="badge badge-soft">实时更新</span>
                    </div>
                    <div id="summary-list" class="summary-list empty-list">
                        <p>检测完成后会列出识别到的车牌和出现次数</p>
                    </div>
                </article>

                <article class="card insight-card">
                    <div class="card-head">
                        <h2>检测明细</h2>
                        <span class="badge badge-soft">图片模式</span>
                    </div>
                    <div id="detail-list" class="detail-list empty-list">
                        <p>图片模式会列出检测框坐标和置信度，视频模式显示帧处理信息</p>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
